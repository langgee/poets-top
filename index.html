<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>poets.top - 诗歌的栖息地</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Noto Serif SC", "Source Han Serif SC", "SimSun", serif;
            background: #faf8f5;
            color: #333;
            line-height: 1.8;
        }
        .container {
            max-width: 680px;
            margin: 0 auto;
            padding: 60px 20px;
        }
        header {
            text-align: center;
            margin-bottom: 80px;
        }
        h1 {
            font-size: 2.5rem;
            font-weight: 400;
            letter-spacing: 8px;
            color: #2c2c2c;
            margin-bottom: 10px;
        }
        .subtitle {
            font-size: 0.95rem;
            color: #999;
            letter-spacing: 2px;
        }
        .divider {
            width: 40px;
            height: 1px;
            background: #ccc;
            margin: 30px auto;
        }
        .poem {
            margin-bottom: 60px;
            text-align: center;
        }
        .poem-title {
            font-size: 1.3rem;
            color: #2c2c2c;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .poem-author {
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 25px;
        }
        .poem-body {
            font-size: 1.05rem;
            color: #444;
            line-height: 2.2;
            white-space: pre-wrap;
        }
        footer {
            text-align: center;
            margin-top: 100px;
            padding-top: 40px;
            border-top: 1px solid #e8e8e8;
            font-size: 0.8rem;
            color: #aaa;
        }
        @media (max-width: 600px) {
            h1 { font-size: 1.8rem; letter-spacing: 4px; }
            .container { padding: 40px 16px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>poets.top</h1>
            <p class="subtitle">诗歌的栖息地</p>
            <div class="divider"></div>
        </header>

        <article class="poem">
            <h2 class="poem-title">静夜思</h2>
            <p class="poem-author">[唐] 李白</p>
            <p class="poem-body">床前明月光，
疑是地上霜。
举头望明月，
低头思故乡。</p>
        </article>

        <article class="poem">
            <h2 class="poem-title">再别康桥</h2>
            <p class="poem-author">徐志摩</p>
            <p class="poem-body">轻轻的我走了，
正如我轻轻的来；
我轻轻的招手，
作别西天的云彩。</p>
        </article>

        <article class="poem">
            <h2 class="poem-title">面朝大海，春暖花开</h2>
            <p class="poem-author">海子</p>
            <p class="poem-body">从明天起，做一个幸福的人
喂马，劈柴，周游世界
从明天起，关心粮食和蔬菜
我有一所房子，面朝大海，春暖花开</p>
        </article>

        <footer>
            <p>  poets.top · 以诗会友</p>
        </footer>
    </div>
</body>
</html>
